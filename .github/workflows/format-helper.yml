name: Format Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/issue-5-format-helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply Ultracite autofixes
        run: bunx ultracite fix || true
      - name: Apply remaining lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browse = Path('src/__tests__/browse.test.ts')
          text = browse.read_text()
          text = text.replace(
          '''    expect(result.profile?.screen_name).toBe("ada");
              expect(result.posts?.map((tweet) => tweet.id)).toStrictEqual(["1"]);
              expect(result.markdown).toContain("[@ada](https://x.com/ada)");
              expect(result.markdown).toContain("[Source](https://x.com/ada/status/1)");
              expect(result.markdown).toContain("/ada?cursor=next");
              expect(result.markdown).toContain("/ada?page=2");''',
          '''    expect({
                postIds: result.posts?.map((tweet) => tweet.id),
                profile: result.profile?.screen_name,
              }).toStrictEqual({ postIds: ["1"], profile: "ada" });
              expect(
                [
                  "[@ada](https://x.com/ada)",
                  "[Source](https://x.com/ada/status/1)",
                  "/ada?cursor=next",
                  "/ada?page=2",
                ].every((value) => result.markdown.includes(value))
              ).toBeTruthy();''')
          text = text.replace(
          '''    expect(calls).toStrictEqual([
                ["effect", "latest", undefined, 7],
                ["effect", "latest", "page-2", 7],
              ]);
              expect(result.nextCursor).toBe("page-3");
              expect(result.markdown).toContain("q=effect&feed=latest");
              expect(result.markdown).toContain("full=true");
              expect(result.markdown).toContain("limit=7");
              expect(result.markdown).toContain("cursor=page-3");
              expect(result.markdown).toContain("page=3");''',
          '''    expect({ calls, nextCursor: result.nextCursor }).toStrictEqual({
                calls: [
                  ["effect", "latest", undefined, 7],
                  ["effect", "latest", "page-2", 7],
                ],
                nextCursor: "page-3",
              });
              expect(
                [
                  "q=effect&feed=latest",
                  "full=true",
                  "limit=7",
                  "cursor=page-3",
                  "page=3",
                ].every((value) => result.markdown.includes(value))
              ).toBeTruthy();''')
          browse.write_text(text)

          converter_test = Path('src/__tests__/converter.test.ts')
          text = converter_test.read_text()
          text = text.replace(
          '''    const request = (thread?: string) =>
                Effect.result(
                  convertTweetEffect({
                    thread,
                    url: "https://x.com/cacheuser/status/1234567890",
                  })
                );
              const [defaultResult, full, conversation, off] = await Effect.runPromise(
                Effect.provide(
                  Effect.all([
                    request(),
                    request("full"),
                    request("conversation"),
                    request("off"),
                  ]),
                  layer
                )
              );''',
          '''    const [defaultResult, full, conversation, off] = await Effect.runPromise(
                Effect.provide(
                  Effect.all([
                    Effect.result(
                      convertTweetEffect({
                        url: "https://x.com/cacheuser/status/1234567890",
                      })
                    ),
                    Effect.result(
                      convertTweetEffect({
                        thread: "full",
                        url: "https://x.com/cacheuser/status/1234567890",
                      })
                    ),
                    Effect.result(
                      convertTweetEffect({
                        thread: "conversation",
                        url: "https://x.com/cacheuser/status/1234567890",
                      })
                    ),
                    Effect.result(
                      convertTweetEffect({
                        thread: "off",
                        url: "https://x.com/cacheuser/status/1234567890",
                      })
                    ),
                  ]),
                  layer
                )
              );''')
          converter_test.write_text(text)

          tweet_test = Path('src/__tests__/tweet-fetch.test.ts')
          text = tweet_test.read_text()
          text = text.replace('{ mode: "off" as const, ranking: undefined }', '{ mode: "off" as const, ranking: null }')
          text = text.replace('expect(rankings[0]).toBe(ranking);', 'expect(rankings[0] ?? null).toBe(ranking);')
          tweet_test.write_text(text)

          converter = Path('src/lib/converter.ts')
          text = converter.read_text()
          text = text.replace(
          '''import {
            layerPostLookupWithoutDependencies,
            PostLookup,
          } from "./tweet-fetch.js";''',
          '''import { PostLookup } from "./tweet-fetch.js";''')
          converter.write_text(text)

          browse_lib = Path('src/lib/browse.ts')
          text = browse_lib.read_text().replace('\ntype BrowsePayload = Omit<BrowseResult, "cache">;\n', '\n')
          browse_lib.write_text(text)
          PY
          bunx ultracite fix || true
      - name: Verify Ultracite
        run: bunx ultracite check
      - name: Commit formatter and lint fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Tito"
          git config user.email "github@mynameistito.com"
          git add src
          git commit -m "chore: satisfy Ultracite checks"
          git push origin HEAD:agent/issue-5-format-helper
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Validate Alchemy stack
        run: bun run alchemy:check
