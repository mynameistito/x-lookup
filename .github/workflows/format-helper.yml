name: Format Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/issue-5-format-helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply compatibility and test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browse_lib = Path('src/lib/browse.ts')
          text = browse_lib.read_text()
          text = text.replace(
            'import { Cache, buildCacheKey, cacheControlHeader } from "./cache.js";',
            'import { Cache, buildCacheKey, cacheControlHeader, layerIsolateMemory } from "./cache.js";'
          )
          if 'provider-service-adapter.js' not in text:
            text = text.replace(
              'import type { FxTwitterFailure } from "./provider-errors.js";',
              'import type { FxTwitterFailure } from "./provider-errors.js";\nimport { layerFxTwitter } from "./provider-service-adapter.js";'
            )
          marker = '''export const browseEffect = (
            input: BrowseInput
          ): Effect.Effect<BrowseResult, BrowseFailure, Browse> =>
            Browse.use((service) => service.browse(input));'''
          bridge = marker + '''

          const legacyBrowseLayer = layerBrowseWithoutDependencies.pipe(
            Layer.provide([layerIsolateMemory(), layerFxTwitter])
          );

          /** Promise compatibility bridge for callers not yet migrated to Effect. */
          export const browse = (input: BrowseInput) =>
            Effect.runPromise(
              Effect.result(Effect.provide(browseEffect(input), legacyBrowseLayer))
            );'''
          if 'export const browse = (input: BrowseInput)' not in text:
            text = text.replace(marker, bridge)
          browse_lib.write_text(text)

          converter = Path('src/lib/converter.ts')
          text = converter.read_text()
          text = text.replace(
            'import { Cache, buildCacheKey, cacheControlHeader } from "./cache.js";',
            'import { Cache, buildCacheKey, cacheControlHeader, layerIsolateMemory } from "./cache.js";'
          )
          if 'provider-service-adapter.js' not in text:
            text = text.replace(
              'import type { InvalidOutputFormat, OutputFormat } from "./output-format.js";',
              'import type { InvalidOutputFormat, OutputFormat } from "./output-format.js";\nimport { layerFxTwitter, layerSyndication } from "./provider-service-adapter.js";'
            )
          text = text.replace(
            'import { PostLookup } from "./tweet-fetch.js";',
            'import { layerPostLookupWithoutDependencies, PostLookup } from "./tweet-fetch.js";'
          )
          marker = '''export const convertTweetEffect = (
            input: ConvertInput
          ): Effect.Effect<ConvertSuccess, ConvertFailure, Conversion> =>
            Conversion.use((service) => service.convert(input));'''
          bridge = marker + '''

          const legacyPostLookupLayer = layerPostLookupWithoutDependencies.pipe(
            Layer.provide(Layer.mergeAll(layerFxTwitter, layerSyndication))
          );
          const legacyConversionLayer = layerConversionWithoutDependencies.pipe(
            Layer.provide([layerIsolateMemory(), legacyPostLookupLayer])
          );

          /** Promise compatibility bridge for callers not yet migrated to Effect. */
          export const convertTweet = (input: ConvertInput) =>
            Effect.runPromise(
              Effect.result(
                Effect.provide(convertTweetEffect(input), legacyConversionLayer)
              )
            );'''
          if 'export const convertTweet = (input: ConvertInput)' not in text:
            text = text.replace(marker, bridge)
          converter.write_text(text)

          converter_test = Path('src/__tests__/converter.test.ts')
          text = converter_test.read_text()
          text = text.replace(
            '## Parent · 1/2 — Ada (@ada)',
            '## Parent · 1/2 — Parent · Ada (@ada)'
          ).replace(
            '## Post · 2/2 — Ada (@ada)',
            '## Post · 2/2 — Post · Ada (@ada)'
          )
          converter_test.write_text(text)
          PY
          bunx ultracite fix
      - name: Verify Ultracite
        run: bunx ultracite check
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Tito"
          git config user.email "github@mynameistito.com"
          git add src
          git commit -m "test: preserve compatibility contracts"
          git push origin HEAD:agent/issue-5-format-helper
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Validate Alchemy stack
        run: bun run alchemy:check
