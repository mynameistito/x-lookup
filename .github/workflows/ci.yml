name: Finalize issue 3 review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/issue-3-finalize-2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply focused review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          adapter = Path("src/lib/fxtwitter-adapter.ts")
          source = adapter.read_text()
          replacements = {
              "raw.quote === undefined\n        ? undefined": "raw.quote === undefined || raw.quote === null\n        ? undefined",
              "fxFetchJson(`2/status/${id}`, operation)": "fxFetchJson(`2/status/${encodeURIComponent(id)}`, operation)",
              "fxFetchJson(`2/thread/${id}`, operation)": "fxFetchJson(`2/thread/${encodeURIComponent(id)}`, operation)",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"missing adapter replacement target: {old}")
              source = source.replace(old, new, 1)
          adapter.write_text(source)

          tests = Path("src/__tests__/provider-adapters.test.ts")
          source = tests.read_text()
          marker = '  test("classifies private, not-found, search refusal, and upstream failures", async () => {'
          if marker not in source:
              raise SystemExit("missing provider adapter test insertion marker")
          regression = '''  test("accepts null quotes and encodes status and thread ids", async () => {
    const requests: string[] = [];
    const client = makeClient((request) => {
      requests.push(request.url);
      if (request.url.includes("/2/thread/")) {
        return Response.json({
          code: 200,
          thread: [{ id: "12/34", text: "thread" }],
        });
      }
      return Response.json({
        code: 200,
        status: { id: "12/34", quote: null, text: "post" },
      });
    });

    const tweet = await runWithClient(fetchFxStatusEffect("12/34"), client);
    const thread = await runWithClient(fetchFxThreadEffect("12/34"), client);

    expect(tweet.quote).toBeUndefined();
    expect(thread[0]?.id).toBe("12/34");
    expect(
      requests.some((url) => url.includes("/2/status/12%2F34"))
    ).toBeTruthy();
    expect(
      requests.some((url) => url.includes("/2/thread/12%2F34"))
    ).toBeTruthy();
  });

'''
          source = source.replace(marker, regression + marker, 1)
          tests.write_text(source)
          PY
          bun run fix
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run alchemy:check
      - name: Commit validated source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fxtwitter-adapter.ts src/__tests__/provider-adapters.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve FxTwitter transport edge cases"
          git push origin HEAD:tmp/issue-3-finalize-2

# validation trigger
