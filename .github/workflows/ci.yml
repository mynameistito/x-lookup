name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/effect-http-providers
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply Effect adapter lint fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/lib/provider-http.ts",
              'import { FetchHttpClient, HttpClient } from "effect/unstable/http";',
              'import type { HttpClient } from "effect/unstable/http";\nimport { FetchHttpClient } from "effect/unstable/http";',
          )
          replace(
              "src/lib/provider-errors.ts",
              'export const isProviderFailure = (value: unknown): value is ProviderFailure =>\n  value instanceof Error &&\n  "_tag" in value &&\n  typeof value._tag === "string" &&\n  PROVIDER_FAILURE_TAGS.has(value._tag);',
              'export const isProviderFailure = (candidate: unknown): candidate is ProviderFailure =>\n  candidate instanceof Error &&\n  "_tag" in candidate &&\n  typeof candidate._tag === "string" &&\n  PROVIDER_FAILURE_TAGS.has(candidate._tag);',
          )

          path = Path("src/lib/fxtwitter.ts")
          text = path.read_text()
          replacements = [
              ('  input: unknown,\n  operation: string\n): Effect.Effect<FxTweet, FxTwitterSchemaError> =>\n  Effect.gen(function* () {\n    const raw = yield* decodeTweetTransport(input).pipe(', '  payload: unknown,\n  operation: string\n): Effect.Effect<FxTweet, FxTwitterSchemaError> =>\n  Effect.gen(function* decodeTweetEffect() {\n    const raw = yield* decodeTweetTransport(payload).pipe('),
              ('const decodeAuthor = (\n  input: unknown,\n  operation: string\n): Effect.Effect<FxAuthor, FxTwitterSchemaError> =>\n  decodeAuthorTransport(input).pipe(', 'const decodeAuthor = (\n  payload: unknown,\n  operation: string\n): Effect.Effect<FxAuthor, FxTwitterSchemaError> =>\n  decodeAuthorTransport(payload).pipe('),
              ('const fxFetchJson = Effect.fn("FxTwitter.fetchJson")(function* (', 'const fxFetchJson = Effect.fn("FxTwitter.fetchJson")(function* fxFetchJsonEffect('),
              ('export const fetchFxProfile = Effect.fn("FxTwitter.fetchProfile")(function* (', 'export const fetchFxProfile = Effect.fn("FxTwitter.fetchProfile")(function* fetchFxProfileEffect('),
              (')(function* (handle: string, cursor?: string, count = 20) {', ')(function* fetchFxProfileStatusesEffect(handle: string, cursor?: string, count = 20) {'),
              ('  return Effect.gen(function* () {\n    const data = yield* fxFetchJson(`2/search?${query}`, operation);', '  return Effect.gen(function* searchFxStatusesEffect() {\n    const data = yield* fxFetchJson(`2/search?${query}`, operation);'),
              ('export const fetchFxConnections = Effect.fn("FxTwitter.fetchConnections")(\n  function* (', 'export const fetchFxConnections = Effect.fn("FxTwitter.fetchConnections")(\n  function* fetchFxConnectionsEffect('),
              ('export const fetchFxStatus = Effect.fn("FxTwitter.fetchStatus")(function* (', 'export const fetchFxStatus = Effect.fn("FxTwitter.fetchStatus")(function* fetchFxStatusEffect('),
              ('export const fetchFxThread = Effect.fn("FxTwitter.fetchThread")(function* (', 'export const fetchFxThread = Effect.fn("FxTwitter.fetchThread")(function* fetchFxThreadEffect('),
              (')(function* (id: string, rankingMode: FxReplyRanking = "likes", limit = 10) {', ')(function* fetchFxConversationRepliesEffect(id: string, rankingMode: FxReplyRanking = "likes", limit = 10) {'),
              ('export const fetchFxFullThread = Effect.fn("FxTwitter.fetchFullThread")(\n  function* (id: string) {', 'export const fetchFxFullThread = Effect.fn("FxTwitter.fetchFullThread")(\n  function* fetchFxFullThreadEffect(id: string) {'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing fxtwitter replacement: {old[:100]!r}")
              text = text.replace(old, new, 1)

          old = '''      replying_to_status:
        raw.replying_to_status === null
          ? null
          : raw.replying_to_status
            ? [...raw.replying_to_status]
            : undefined,
      reposted_by:
        raw.reposted_by === null
          ? null
          : raw.reposted_by
            ? normalizeAuthor(raw.reposted_by)
            : undefined,'''
          new = '''      replying_to_status: normalizeReplyingToStatus(raw.replying_to_status),
      reposted_by: normalizeRepostedBy(raw.reposted_by),'''
          if old not in text:
              raise SystemExit("missing nested ternary block")
          text = text.replace(old, new, 1)

          marker = '''const schemaFailure = (operation: string, cause: unknown): FxTwitterSchemaError =>
  new FxTwitterSchemaError({ cause, operation });
'''
          helpers = '''const normalizeReplyingToStatus = (
  status: readonly string[] | null | undefined
): string[] | null | undefined => {
  if (status === null) {
    return null;
  }
  return status ? [...status] : undefined;
};

const normalizeRepostedBy = (
  author: FxAuthorTransport | null | undefined
): FxAuthor | null | undefined => {
  if (author === null) {
    return null;
  }
  return author ? normalizeAuthor(author) : undefined;
};

'''
          if marker not in text:
              raise SystemExit("missing schemaFailure marker")
          text = text.replace(marker, helpers + marker, 1)

          old = '''  return fetchFxStatus(currentId).pipe(
    Effect.flatMap((tweet) => {
      walked.push(tweet);
      const parentId = getParentStatusId(tweet);
      return parentId
        ? walkParentChain(parentId, walked, seen)
        : Effect.succeed(walked.toReversed());
    }),
    Effect.catch((error) =>
      error._tag === "FxTwitterPrivateTweetError"
        ? Effect.fail(error)
        : Effect.succeed(walked.toReversed())
    )
  );'''
          new = '''  return fetchFxStatus(currentId).pipe(
    Effect.matchEffect({
      onFailure: (error) =>
        error._tag === "FxTwitterPrivateTweetError"
          ? Effect.fail(error)
          : Effect.succeed(walked.toReversed()),
      onSuccess: (tweet) => {
        walked.push(tweet);
        const parentId = getParentStatusId(tweet);
        return parentId
          ? walkParentChain(parentId, walked, seen)
          : Effect.succeed(walked.toReversed());
      },
    })
  );'''
          if old not in text:
              raise SystemExit("missing parent-chain recovery")
          path.write_text(text.replace(old, new, 1))

          path = Path("src/lib/syndication.ts")
          text = path.read_text()
          replacements = [
              ('  input: unknown,\n  handle?: string,', '  payload: unknown,\n  handle?: string,'),
              ('  Effect.gen(function* () {\n    const raw = yield* decodeSyndicationTransport(input).pipe(', '  Effect.gen(function* decodeSyndicationTweetEffect() {\n    const raw = yield* decodeSyndicationTransport(payload).pipe('),
              (')(function* (\n  handle: string,', ')(function* fetchSyndicationStatusEffect(\n  handle: string,'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing syndication replacement: {old[:100]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/lib/tweet-fetch.ts")
          text = path.read_text()
          text = text.replace('const attempts: ReadonlyArray<\n    ProviderEffect<FetchResult, ProviderFailure>\n  > = [', 'const attempts: readonly ProviderEffect<FetchResult, ProviderFailure>[] = [')
          text = text.replace('return Effect.dieMessage("Provider fallback exhausted without an attempt");', 'return Effect.die("Provider fallback exhausted without an attempt");')
          text = text.replace('const fromFxTwitter = Effect.gen(function* () {', 'const fromFxTwitter = Effect.gen(function* fromFxTwitterEffect() {')

          old = '''    return attempt.pipe(
      Effect.catch((error) => {
        if (error.code === "private_tweet") {
          return Effect.fail(error);
        }
        // Prefer a truthful "missing" verdict from any provider over later
        // upstream failures when everything else failed.
        const nextNotFound =
          notFound ?? (error.status === 404 ? error : undefined);
        return run(index + 1, nextNotFound, error);
      })
    );'''
          new = '''    return attempt.pipe(
      Effect.matchEffect({
        onFailure: (error) => {
          if (error.code === "private_tweet") {
            return Effect.fail(error);
          }
          // Prefer a truthful "missing" verdict from any provider over later
          // upstream failures when everything else failed.
          const nextNotFound =
            notFound ?? (error.status === 404 ? error : undefined);
          return run(index + 1, nextNotFound, error);
        },
        onSuccess: Effect.succeed,
      })
    );'''
          if old not in text:
              raise SystemExit("missing fallback catch")
          text = text.replace(old, new, 1)

          old = '''    const replies = yield* fetchFxConversationReplies(id, ranking, 10).pipe(
      Effect.catch(() => Effect.succeed<FxTweet[]>([]))
    );'''
          new = '''    const replies = yield* fetchFxConversationReplies(id, ranking, 10).pipe(
      Effect.matchEffect({
        onFailure: () => Effect.succeed<FxTweet[]>([]),
        onSuccess: Effect.succeed,
      })
    );'''
          if old not in text:
              raise SystemExit("missing reply catch")
          text = text.replace(old, new, 1)

          old = '''  return fromFxTwitter.pipe(
    Effect.catch((error) =>
      error.code === "private_tweet"
        ? Effect.fail(error)
        : fetchStatusWithFallback(handle, id).pipe(
            Effect.map((result) => ({
              ...result,
              tweets: annotateAndDedupe(result.tweets, id, []),
            }))
          )
    )
  );'''
          new = '''  return fromFxTwitter.pipe(
    Effect.matchEffect({
      onFailure: (error) =>
        error.code === "private_tweet"
          ? Effect.fail(error)
          : fetchStatusWithFallback(handle, id).pipe(
              Effect.map((result) => ({
                ...result,
                tweets: annotateAndDedupe(result.tweets, id, []),
              }))
            ),
      onSuccess: Effect.succeed,
    })
  );'''
          if old not in text:
              raise SystemExit("missing full-thread catch")
          path.write_text(text.replace(old, new, 1))
          PY
          bun run fix || true
          bun run check || true
          bun run typecheck || true
          git status --short
          if ! git diff --quiet -- src/lib/fxtwitter.ts src/lib/syndication.ts src/lib/tweet-fetch.ts src/lib/provider-errors.ts src/lib/provider-http.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/lib/fxtwitter.ts src/lib/syndication.ts src/lib/tweet-fetch.ts src/lib/provider-errors.ts src/lib/provider-http.ts
            git commit -m "chore: apply Effect adapter lint fixes"
            git push origin HEAD:feat/effect-http-providers
          fi
          exit 1
