name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run check
          - name: Typecheck
            command: bun run typecheck
          - name: Test
            command: bun run test
          - name: Validate Alchemy stack
            command: bun run alchemy:check
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deployments are gated on the PR head SHA reported by workflow_run.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
      - run: ${{ matrix.command }}
