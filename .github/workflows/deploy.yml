name: Deploy

on:
  # CI is credential-free; this workflow receives privilege only after it
  # reports success for the exact commit being deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha || format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      deployment_sha: ${{ steps.resolve.outputs.deployment_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      stage: ${{ steps.resolve.outputs.stage }}
      preview: ${{ steps.resolve.outputs.preview }}
    steps:
      - name: Resolve deployment target
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event.workflow_run.event }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ]; then
            {
              echo "deploy=true"
              echo "deployment_sha=$DEPLOYMENT_SHA"
              echo "stage=prod"
              echo "preview=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(gh api \
            "repos/$REPOSITORY/commits/$DEPLOYMENT_SHA/pulls" \
            -H 'Accept: application/vnd.github+json' \
            --jq "map(select(.head.repo.full_name == \"$REPOSITORY\" and .head.sha == \"$DEPLOYMENT_SHA\"))[0].number // empty")
          if [ -z "$pr_number" ]; then
            echo "No same-repository pull request owns $DEPLOYMENT_SHA; refusing preview deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "deploy=true"
            echo "deployment_sha=$DEPLOYMENT_SHA"
            echo "pr_number=$pr_number"
            echo "stage=pr-$pr_number"
            echo "preview=true"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: >-
      needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      DEPLOYMENT_SHA: ${{ needs.resolve.outputs.deployment_sha }}
      STAGE: ${{ needs.resolve.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.deployment_sha }}
      - uses: ./.github/actions/setup-bun
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable Alchemy deploys." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create GitHub deployment
        id: create-deployment
        run: bun run deploy:report create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ env.STAGE }}
      - name: Deploy Alchemy stack
        id: deploy
        # --adopt preserves the pre-Alchemy production Worker identity.
        run: |
          set -o pipefail
          bunx alchemy deploy --stage "$STAGE" --yes --adopt 2>&1 | tee "$RUNNER_TEMP/alchemy-deploy.log"
          bun run deploy:output "$RUNNER_TEMP/alchemy-deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Complete GitHub deployment
        if: always() && steps.create-deployment.outcome == 'success'
        run: bun run deploy:report complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ env.STAGE }}
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_LOGS_URL: ${{ steps.deploy.outputs.logs_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
      - name: Comment deployment URL on pull request
        if: always() && needs.resolve.outputs.preview == 'true' && steps.create-deployment.outcome == 'success'
        run: bun run deploy:report comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ env.STAGE }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_LOGS_URL: ${{ steps.deploy.outputs.logs_url }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview-cleanup
    permissions:
      contents: read
      deployments: write
    env:
      STAGE: ${{ format('pr-{0}', github.event.pull_request.number) }}
    steps:
      # Never check out the closed PR. Cleanup executes trusted base code only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-bun
      - name: Guard against production teardown
        run: |
          case "$STAGE" in
            pr-[1-9]*|pr-[1-9][0-9]*) ;;
            *)
              echo "refusing to destroy a non-preview stage: $STAGE" >&2
              exit 1
              ;;
          esac
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable preview cleanup." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Destroy preview stack
        id: destroy
        run: |
          set -o pipefail
          bunx alchemy destroy --stage "$STAGE" --yes 2>&1 | tee "$RUNNER_TEMP/alchemy-destroy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Keep records as evidence of a potentially orphaned stack when destroy
      # fails. The Actions log retains the complete destroy output.
      - name: Record failed cleanup diagnostics
        if: always() && steps.destroy.outcome != 'success'
        run: |
          {
            echo "## Preview cleanup failed"
            echo ""
            echo "Alchemy destroy did not succeed for \\`$STAGE\\`. GitHub deployment records were intentionally retained."
            echo ""
            echo "Review this run's logs and retry cleanup after resolving the Cloudflare/Alchemy failure."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete GitHub preview deployments
        if: steps.destroy.outcome == 'success'
        run: bun run deploy:report cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ env.STAGE }}
