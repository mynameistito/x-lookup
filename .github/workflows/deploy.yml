name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: alchemy-deploy-${{ github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # Secure preview policy canary, pinned to an immutable alchemy-deploy commit.
        uses: mynameistito/alchemy-deploy@7dbf3ea642245fd40ffab295679031e8e19e5f17
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: x-lookup
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          # Canary safety: no branch can satisfy this value, so production is disabled.
          production-branch: canary-production-disabled
          production-url: https://x-lookup.mynameistito.com
          preview-url-pattern: https://{worker}-{stage}.*.workers.dev
          use-adopt: true
