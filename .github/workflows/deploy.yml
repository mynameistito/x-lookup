name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One deploy at a time per ref so preview and prod runs never interleave.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Pushes are restricted to main, so STAGE is always `pr-<number>` (pull
# requests) or `prod` (main).
env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  deploy:
    # Fork pull requests never deploy: the guard keeps repository secrets away
    # from untrusted code, and the job would fail on empty credentials anyway.
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable Alchemy deploys." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create GitHub deployment
        id: create-deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STAGE: ${{ env.STAGE }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.STAGE,
              description: `Alchemy ${process.env.STAGE} deployment`,
              transient_environment: process.env.STAGE !== "prod",
              production_environment: process.env.STAGE === "prod",
              auto_merge: false,
              required_contexts: [],
            });

            core.setOutput("id", deployment.data.id.toString());
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "in_progress",
              description: "Deploying the Alchemy stack",
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Deploy Alchemy stack
        id: deploy
        # --adopt lets the first prod run adopt the pre-Alchemy Worker in
        # place; once owned via Alchemy tags it is a no-op.
        run: |
          set -o pipefail
          bunx alchemy deploy --stage "$STAGE" --yes --adopt 2>&1 | tee "$RUNNER_TEMP/alchemy-deploy.log"
          if [ "$STAGE" = "prod" ]; then
            url="https://x-lookup.mynameistito.com"
            worker_name="x-lookup"
          else
            url="$(grep -Eo 'https://[[:alnum:].-]+workers.dev' "$RUNNER_TEMP/alchemy-deploy.log" | tail -n 1 || true)"
            worker_name="x-lookup-$STAGE"
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not determine the deployed Worker URL from Alchemy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "logs_url=https://dash.cloudflare.com/?to=/$CLOUDFLARE_ACCOUNT_ID/workers/services/view/$worker_name/production/logs" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Complete GitHub deployment
        if: always() && steps.create-deployment.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_LOGS_URL: ${{ steps.deploy.outputs.logs_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const succeeded = process.env.DEPLOY_OUTCOME === "success";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: succeeded ? "success" : "failure",
              description: succeeded ? "Deployment is live" : "Deployment failed",
              environment_url: process.env.DEPLOYMENT_URL || undefined,
              log_url: process.env.CLOUDFLARE_LOGS_URL || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Comment deployment URL on pull request
        if: always() && github.event_name == 'pull_request' && github.event.action != 'closed' && steps.create-deployment.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_LOGS_URL: ${{ steps.deploy.outputs.logs_url }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          STAGE: ${{ env.STAGE }}
        with:
          script: |
            const marker = `<!-- x-lookup-deployment: ${process.env.STAGE} -->`;
            const succeeded = process.env.DEPLOY_OUTCOME === "success";
            const workerName = process.env.STAGE === "prod" ? "x-lookup" : `x-lookup-${process.env.STAGE}`;
            const logsUrl = process.env.CLOUDFLARE_LOGS_URL || `https://dash.cloudflare.com/?to=/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/services/view/${workerName}/production/logs`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updated = new Intl.DateTimeFormat("en-US", {
              month: "short",
              day: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: true,
              timeZone: "UTC",
            }).format(new Date()).replace(/, /g, " ");
            const status = succeeded ? "✅ Deployment successful!" : "❌ Deployment failed";
            const name = succeeded ? `[${workerName}](${process.env.DEPLOYMENT_URL})` : workerName;
            const body = [
              marker,
              '## Deploying with <a href="https://workers.dev"><img alt="Cloudflare Workers" src="https://workers.cloudflare.com/logo.svg" width="16"></a> Cloudflare Workers',
              "",
              "The latest updates on your project.",
              "",
              "| Status | Name | Latest Commit | Updated (UTC) |",
              "| - | - | - | - |",
              `| ${status} <br>[View logs](${logsUrl}) | ${name} | [${context.sha.slice(0, 8)}](${commitUrl}) | ${updated} |`,
              "",
              `**GitHub Actions run:** [View deployment diagnostics](${runUrl})`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Guard against production teardown
        run: |
          if [ "$STAGE" = "prod" ]; then
            echo "refusing to destroy the prod stage from a pull request" >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable preview cleanup." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Delete GitHub preview deployments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STAGE: ${{ env.STAGE }}
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: process.env.STAGE,
              per_page: 100,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Pull request closed",
              });
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
              });
            }
      - name: Destroy preview stack
        run: bunx alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
