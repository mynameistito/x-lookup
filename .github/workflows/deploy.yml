name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request:
    types: [closed]

jobs:
  deploy:
    uses: mynameistito/alchemy-deploy/.github/workflows/deploy.yml@2615f57b12c33ef256d8395a559f5f3643843beb # v1.0.0
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    with:
      worker-name: x-lookup
      deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
      destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
      production-stage: prod
      production-url: https://x-lookup.mynameistito.com
      preview-url-pattern: https://{worker}-{stage}.*.workers.dev
      use-adopt: true
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
