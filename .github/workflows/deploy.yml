name: Deploy

on:
  workflow_run:
    workflows: [CI (artifact)]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: alchemy-deploy-${{ github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@1b495c668753637a7820112cea1773b8878fd4b9 # v3.1.2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: x-lookup
          deploy-command: bun ./node_modules/alchemy/bin/cli.js deploy --stage "$STAGE" --yes
          destroy-command: bun ./node_modules/alchemy/bin/cli.js destroy --stage "$STAGE" --yes
          production-stage: prod
          production-branch: main
          production-url: https://x-lookup.mynameistito.com
          preview-url-pattern: https://{worker}-{stage}.*.workers.dev
          use-adopt: true
          preview-artifact: alchemy-worker
          preview-entrypoint: worker/index.js
          preview-compatibility-date: "2026-07-04"
          worker-config: '{"CACHE_TTL_SECONDS":"3600"}'
